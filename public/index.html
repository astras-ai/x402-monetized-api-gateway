<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIFoundry.sh | x402 Monetized Edge Gateway & Security Agent</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
            },
            cosmic: {
              950: '#030712',
              900: '#060b19',
              850: '#0a1024',
              800: '#0e1738',
              700: '#172554',
              border: 'rgba(99, 102, 241, 0.25)',
              glow: 'rgba(34, 211, 238, 0.15)'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    /* Prevent hydration screen flash */
    html, body {
      background-color: #030712 !important;
      color: #f3f4f6 !important;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #030712;
    }

    /* Stable Cosmic Background without jarring repaints */
    .cosmic-grid {
      background-color: #030712;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .glass-panel {
      background: rgba(10, 16, 36, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .glass-panel-glow {
      background: rgba(10, 16, 36, 0.92);
      border: 1px solid rgba(34, 211, 238, 0.3);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.08);
    }
  </style>

  <!-- Importmap for React and Lucide Icons -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom"
    }
  }
  </script>
</head>
<body class="min-h-screen cosmic-grid bg-[#030712] text-gray-100 antialiased selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <!-- Main React Frontend Script (Native ES Module) -->
  <script type="module" src="app.js"></script>
</body>
</html>
